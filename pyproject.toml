[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poetry]
name = "SuperSTATs"
version = "0.1.0"
description = "SuperNURDs stats app"
authors = ["SuperNURDs 2023 Software Team"]

[project]
name = "SuperSTATs"
version = "0.1.0"
authors = [
  { name="SuperNURDs 2023 Software Team", email="frcteam3255@gmail.com" },
]
description = "SuperNURDs stats app"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "streamlit~=1.30",
    "tbapy~=1.3",
    "urllib3~=1.26",
    "plotly~=5.17",
    "beautifulsoup4~=4.12.2"
]

[project.urls]
"Homepage" = "https://github.com/FRCTeam3255/SuperSTATS"
"Bug Tracker" = "https://github.com/FRCTeam3255/SuperSTATS/issues"
"Pull Requests" = "https://github.com/FRCTeam3255/SuperSTATS/pulls"