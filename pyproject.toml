[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poetry]
name = "SuperSTATs"
version = "2.0.0"
description = "SuperNURDs stats app"
authors = ["SuperNURDs Software Team"]

[project]
name = "SuperSTATs"
version = "2.0.0"
authors = [
  { name="SuperNURDs Software Team", email="frcteam3255@gmail.com" },
]
description = "SuperNURDs stats app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.44",
    "tbapy~=1.3",
    "urllib3~=1.26",
    "plotly~=5.17",
    "beautifulsoup4~=4.12",
    "matplotlib~=3.8",
    "qrcode~=7.4"
]

[project.urls]
"Homepage" = "https://github.com/FRCTeam3255/SuperSTATS"
"Bug Tracker" = "https://github.com/FRCTeam3255/SuperSTATS/issues"
"Pull Requests" = "https://github.com/FRCTeam3255/SuperSTATS/pulls"