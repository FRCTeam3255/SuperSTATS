[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "SuperSTATs"
version = "0.0.1"
authors = [
  { name="SuperNURDs 2023 Software Team", email="frcteam3255@gmail.com" },
]
description = "SuperNURDs stats app"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
  "streamlit~=1.22",
  "git+https://github.com/streamlit/gsheets-connection",
  "tbapy~=1.3",
  "urllib3~=1.26",
]

[project.urls]
"Homepage" = "https://github.com/FRCTeam3255/SuperSTATS"
"Bug Tracker" = "https://github.com/FRCTeam3255/SuperSTATS/issues"